services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alalqami
      POSTGRES_PASSWORD: alalqami
      POSTGRES_DB: alalqami_agent
    ports:
      - "5432:5432"
    volumes:
      - alalqami_agent_pg:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  alalqami_agent_pg:
